<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cheap Flights</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Home JS -->
<script src="/js/home.js"></script>
    
<!-- Bootstrap Navbar Header -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">✈️ Cheap Flights Console (RyanAir)</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Flights</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Check-in</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Origin And Destination Dropdown -->
    <form class="mt-4">
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="originSelect" class="form-label">Origin Airport</label>
                <select id="originSelect" name="origin" class="form-select">
                    <option th:each="airport : ${airports}"
                            th:value="${airport.code}"
                            th:text="${airport.name + ' - ' + airport.code}">
                        Airport Name
                    </option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="destinationSelect" class="form-label">Destination Airport</label>
                <select id="destinationSelect" name="destination" class="form-select">
                    <option th:each="airport : ${airports}"
                            th:value="${airport.code}"
                            th:text="${airport.name + ' - ' + airport.code}">
                        Airport Name
                    </option>
                </select>
            </div>
        </div>

        <div class="text-end">
            <button type="submit" class="btn btn-primary">Search Flights</button>
        </div>
    </form>
</div>



<!-- Bootstrap JS (optional, for navbar toggling on mobile) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

<!-- Copyright -->
<div class="text-center p-3" style="background-color: rgba(0, 0, 0, 0.05);">
    Made with ❤️ by Túlio Wetler <a class="text-reset fw-bold" href="https://twetler.github.io">twetler.github.io</a>
</div>

</body>
</html>
