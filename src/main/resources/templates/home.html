<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Cheap Flights</title>
    <link rel="icon" type="image/x-icon" href="/favicon.ico">
    <link rel="stylesheet" href="/css/calendar.css">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<!-- Home JS -->
<script src="/js/home.js"></script>
    
<!-- Bootstrap Navbar Header -->
<nav class="navbar navbar-expand-lg navbar-dark bg-dark">
    <div class="container-fluid">
        <a class="navbar-brand" href="#">✈️ Cheap Flights Console (RyanAir)</a>
        <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav"
                aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
            <span class="navbar-toggler-icon"></span>
        </button>
        <div class="collapse navbar-collapse" id="navbarNav">
            <ul class="navbar-nav ms-auto">
                <li class="nav-item">
                    <a class="nav-link active" aria-current="page" href="/home">Home</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Flights</a>
                </li>
                <li class="nav-item">
                    <a class="nav-link" href="#">Check-in</a>
                </li>
            </ul>
        </div>
    </div>
</nav>

<!-- Origin And Destination Dropdown -->
<div class="container mt-5">
    <form method="get" action="/home" class="mt-4">
        <div class="row mb-3">
            <div class="col-md-6">
                <label for="originSelect" class="form-label">Origin Airport</label>
                <!-- Origin Dropdown -->
                <select id="originSelect" name="origin" class="form-select">
                    <option th:each="airport : ${airports}"
                            th:value="${airport.code}"
                            th:text="${airport.name + ' - ' + airport.code}"
                            th:selected="${airport.code == origin}">
                        Airport Name
                    </option>
                </select>
            </div>
            <div class="col-md-6">
                <label for="destinationSelect" class="form-label">Destination Airport</label>
                <select id="destinationSelect" name="destination" class="form-select">
                    <option th:each="airport : ${airports}"
                            th:value="${airport.code}"
                            th:text="${airport.name + ' - ' + airport.code}"
                            th:selected="${airport.code == destination}">
                        Airport Name
                    </option>
                </select>
            </div>
        </div>

        <div class="text-end">
            <button type="submit" class="btn btn-primary">Search Flights</button>
        </div>
    </form>

    <!-- Conditional result message -->
    <div id="current-pick" th:if="${origin} != null and ${destination} != null" class="alert alert-info mt-4" style="display: block;">
        <h5>Showing flights from <strong th:text="${origin}"></strong> to <strong th:text="${destination}"></strong></h5>
    </div>
</div>

<!-- Bootstrap JS (optional, for navbar toggling on mobile) -->
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>


 <!-- Calendar wrapped in Bootstrap container -->
<div class="container mt-5">
    <div th:replace="~{fragments/calendar :: calendar}"></div>
</div>
<script src="/js/calendar.js"></script>

<!-- Copyright -->
<footer class="text-center py-3 bg-light text-muted border-top fixed-bottom">
    Made with ❤️ by Túlio Wetler —
    <a class="text-reset fw-bold" href="https://twetler.github.io" target="_blank">twetler.github.io</a>
</footer>



</body>
</html>
